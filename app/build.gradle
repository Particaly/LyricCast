plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.saihgupr.androidrelay'
    compileSdk 34

    defaultConfig {
        applicationId "com.saihgupr.androidrelay"
        minSdk 21
        targetSdk 34
        versionCode 10
        versionName "1.4.2"
    }

    // CI 发版签名(android-release.yml 通过 -P 注入四个属性);任一缺失则不挂签名,
    // 本地构建不传这些属性,行为与原先一致(release 产物为 unsigned)。
    def hasCiSigning = project.hasProperty('releaseKeystoreFile') &&
            project.hasProperty('releaseKeystorePassword') &&
            project.hasProperty('releaseKeyAlias') &&
            project.hasProperty('releaseKeyPassword')

    signingConfigs {
        if (hasCiSigning) {
            release {
                storeFile file(project.property('releaseKeystoreFile'))
                storePassword project.property('releaseKeystorePassword')
                keyAlias project.property('releaseKeyAlias')
                keyPassword project.property('releaseKeyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasCiSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "android-relay.apk"
        }
    }
}

dependencies {
    // 1.12+ 提供 ServiceCompat.startForeground(service, id, notification, type),minSdk 21 安全
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'org.eclipse.paho:org.eclipse.paho.android.service:1.1.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // 扫码配对:CameraX 取景/分析(仅后摄)+ ZXing 纯 Java QR 解码,均支持 minSdk 21
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    // 单元测试里用真实的 org.json 实现(android.jar 的桩会直接抛"not mocked")
    testImplementation 'org.json:json:20240303'
}
